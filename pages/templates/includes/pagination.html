{% load query_extras %}
{% if page_obj.paginator.num_pages > 1 %}
<div class="pagination">
    {% if page_obj.has_previous %}
        <a class="page-link" href="?{% url_replace request 'page' page_obj.previous_page_number %}">السابق</a>
    {% endif %}
    <span class="page-info">صفحة {{ page_obj.number }} من {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="page-link" href="?{% url_replace request 'page' page_obj.next_page_number %}">التالي</a>
    {% endif %}
</div>
{% endif %}
