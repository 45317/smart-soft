<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f2a66" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- main app card -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="520" height="380" rx="22" fill="url(#cardbg)"/>
    <!-- topbar -->
    <rect x="20" y="20" width="520" height="58" rx="22" fill="#1e293b"/>
    <rect x="20" y="48" width="520" height="30" fill="#1e293b"/>
    <circle cx="46" cy="40" r="12" fill="#2563eb"/>
    <rect x="70" y="32" width="96" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="70" y="47" width="70" height="6" rx="3" fill="#334155"/>
    <circle cx="492" cy="38" r="8" fill="#334155"/>
    <circle cx="512" cy="38" r="8" fill="#475569"/>
    <rect x="470" y="51" width="2" height="2" fill="#fff" opacity="0"/>

    <!-- sidebar rail -->
    <rect x="20" y="78" width="110" height="322" fill="#f1f5f9"/>
    <rect x="36" y="96" width="78" height="26" rx="8" fill="#2563eb"/>
    <rect x="46" y="103" width="12" height="12" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="64" y="105" width="40" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="38" y="140" width="74" height="20" rx="7" fill="#e2e8f0"/>
    <rect x="38" y="176" width="74" height="20" rx="7" fill="#e2e8f0"/>
    <rect x="38" y="212" width="74" height="20" rx="7" fill="#e2e8f0"/>
    <rect x="38" y="248" width="74" height="20" rx="7" fill="#e2e8f0"/>

    <!-- content: stat chips -->
    <rect x="150" y="96" width="150" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="178" cy="122" r="14" fill="#dbeafe"/>
    <rect x="200" y="108" width="70" height="8" rx="4" fill="#94a3b8"/>
    <rect x="200" y="122" width="46" height="8" rx="4" fill="#e2e8f0"/>

    <rect x="316" y="96" width="150" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="344" cy="122" r="14" fill="#dcfce7"/>
    <rect x="366" y="108" width="70" height="8" rx="4" fill="#94a3b8"/>
    <rect x="366" y="122" width="46" height="8" rx="4" fill="#e2e8f0"/>

    <rect x="482" y="96" width="38" height="52" rx="12" fill="#2563eb" opacity="0.12"/>
    <circle cx="501" cy="122" r="10" fill="#2563eb" opacity="0.35"/>

    <!-- chart card -->
    <rect x="150" y="164" width="196" height="176" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="170" y="182" width="90" height="10" rx="5" fill="#94a3b8"/>
    <rect x="170" y="200" width="60" height="7" rx="3.5" fill="#e2e8f0"/>
    <!-- bars -->
    <rect x="176" y="282" width="20" height="44" rx="6" fill="url(#bar)" opacity="0.7"/>
    <rect x="205" y="262" width="20" height="64" rx="6" fill="url(#bar)" opacity="0.8"/>
    <rect x="234" y="244" width="20" height="82" rx="6" fill="#2563eb"/>
    <rect x="263" y="272" width="20" height="54" rx="6" fill="url(#bar)" opacity="0.75"/>
    <rect x="292" y="252" width="20" height="74" rx="6" fill="url(#bar)" opacity="0.9"/>
    <polyline points="176,300 205,292 234,268 263,282 292,258"
              fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- right panel rows -->
    <rect x="362" y="164" width="158" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="378" y="182" width="92" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="378" y="198" width="64" height="7" rx="3.5" fill="#e2e8f0"/>

    <rect x="362" y="234" width="158" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="378" y="252" width="92" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="378" y="268" width="64" height="7" rx="3.5" fill="#e2e8f0"/>

    <rect x="362" y="304" width="158" height="36" rx="10" fill="#2563eb"/>
    <rect x="396" y="316" width="70" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>